<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:site_name" content="{{brand_text}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#15171a">
<meta name="google-site-verification" content="{{gsv}}">
<link rel="icon" href="{{base}}assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{base}}assets/fonts/atkinson-hyperlegible-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{css}}">
{{jsonld}}
{{rules}}
{{scripts}}
</head>
<body data-currency="{{currency}}" data-section="{{section}}">
{{sprite}}
<a class="skip" href="#contenu">{{skip}}</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{home}}" aria-label="{{logo_label}}">{{logo_svg}}<span>{{brand}}</span></a>
    <nav class="nav" id="site-nav" aria-label="{{brand_text}}">{{nav}}</nav>
    <div class="header-actions">
      {{country_switch}}
      {{header_cta}}
      {{menu_toggle}}
    </div>
  </div>
</header>
{{search_dialog}}

<main id="contenu">
{{content}}
</main>

<footer class="site-footer">
  <div class="wrap footer-grid">{{footer}}</div>
  <div class="wrap footer-bottom">
    <p>© {{year}} {{brand_text}}. {{disclaimer}}</p>
  </div>
</footer>
</body>
</html>
